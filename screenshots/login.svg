<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1280" height="720" fill="#F7F8FA"/>
  <!-- Topbar -->
  <rect width="1280" height="48" fill="#fff"/>
  <rect y="48" width="1280" height="1" fill="#E8EAF0"/>
  <rect x="0" y="0" width="56" height="48" fill="#185FA5"/>
  <text x="22" y="30" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">TF</text>
  <text x="68" y="30" fill="#1A1D2E" font-size="14" font-weight="600">TaskFlow</text>
  <rect x="180" y="10" width="90" height="28" rx="6" fill="#EBF3FC"/>
  <text x="225" y="29" fill="#185FA5" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>
  <text x="290" y="29" fill="#6B7280" font-size="12">Tổng Task</text>
  <text x="370" y="29" fill="#6B7280" font-size="12">Tài khoản</text>
  <text x="450" y="29" fill="#6B7280" font-size="12">Tất cả CV</text>
  <text x="530" y="29" fill="#6B7280" font-size="12">Tickets</text>
  <text x="600" y="29" fill="#6B7280" font-size="12">Lịch sử</text>
  <!-- Login card -->
  <rect x="390" y="140" width="500" height="440" rx="12" fill="#fff" stroke="#E8EAF0" stroke-width="1"/>
  <rect x="390" y="140" width="500" height="440" rx="12" fill="#fff" opacity="0.95"/>
  
  <!-- Login content -->
  <rect x="530" y="172" width="220" height="32" rx="8" fill="#185FA5"/>
  <text x="550" y="187" fill="#fff" font-size="20" font-weight="600">TaskFlow</text>
  
  <text x="640" y="230" fill="#1A1D2E" font-size="16" font-weight="600" text-anchor="middle">Đăng nhập</text>
  <text x="640" y="250" fill="#6B7280" font-size="12" text-anchor="middle">Hệ thống quản lý công việc nội bộ</text>
  
  <!-- Error message -->
  <rect x="432" y="270" width="416" height="38" rx="8" fill="#FEF2F2"/>
  <text x="448" y="295" fill="#A32D2D" font-size="12">Tên đăng nhập hoặc mật khẩu không đúng</text>
  
  <rect x="432" y="324" width="416" height="40" rx="8" fill="#fff" stroke="#D0D4DF" stroke-width="1"/>
  <text x="448" y="348" fill="#6B7280" font-size="13">Tên đăng nhập</text>
  
  <rect x="432" y="380" width="416" height="40" rx="8" fill="#fff" stroke="#D0D4DF" stroke-width="1"/>
  <text x="448" y="404" fill="#6B7280" font-size="13">••••••••</text>
  
  <rect x="432" y="440" width="416" height="44" rx="8" fill="#185FA5"/>
  <text x="640" y="468" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Đăng nhập</text>
  
  <!-- Footer -->
  <text x="640" y="520" fill="#9CA3AF" font-size="11" text-anchor="middle">© TaskFlow - Hệ thống quản lý công việc nội bộ</text>
</svg>
